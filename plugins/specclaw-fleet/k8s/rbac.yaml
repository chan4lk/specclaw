apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-dispatcher
  namespace: specclaw-fleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-dispatcher
  namespace: specclaw-fleet
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-dispatcher
  namespace: specclaw-fleet
subjects:
  - kind: ServiceAccount
    name: fleet-dispatcher
    namespace: specclaw-fleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-dispatcher
