parameters:
  - name: change
    displayName: Only this change (empty = every approved, not-started change)
    type: string
    default: " "
  - name: agent
    displayName: Agent for this run (empty = fleet.default_agent in config)
    type: string
    default: " "

variables:
  fleetKubeConnection: specclaw-fleet-k3s
  fleetAzureConnection: specclaw-fleet-azure
  fleetTrustedBranch: main
  fleetSpecclawRef: SET_TO_A_40_CHAR_SPECCLAW_COMMIT_SHA

trigger:
  batch: true
  branches:
    include: [main, "feature/*"]
  paths:
    include: [".specclaw/changes/*/state.json"]
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: dispatch
    timeoutInMinutes: 10
    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true
        sparseCheckoutDirectories: .specclaw
      - script: |
          set -euo pipefail
          ref="$(fleetSpecclawRef)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "##vso[task.logissue type=error]fleetSpecclawRef must be a full commit SHA, got: $ref"; exit 1; }
          dir="$(Agent.TempDirectory)/specclaw"
          git init -q "$dir" && git -C "$dir" sparse-checkout set plugins/specclaw-fleet plugins/specclaw-sync \
            && git -C "$dir" fetch -q --depth 1 --filter=blob:none https://github.com/chan4lk/specclaw.git "$ref" && git -C "$dir" checkout -q FETCH_HEAD
          [[ "$(git -C "$dir" rev-parse HEAD)" == "$ref" ]] || { echo "##vso[task.logissue type=error]fetched commit does not match $ref"; exit 1; }
          echo "specclaw-fleet code: chan4lk/specclaw@$ref"
          echo "##vso[task.prependpath]$(Agent.TempDirectory)/specclaw/plugins/specclaw-sync/bin"
          echo "##vso[task.prependpath]$(Agent.TempDirectory)/specclaw/plugins/specclaw-fleet/bin"
        displayName: Fetch specclaw-fleet at a pinned ref
      - task: Kubernetes@1
        displayName: kubectl login
        inputs:
          connectionType: Kubernetes Service Connection
          kubernetesServiceEndpoint: ${{ variables.fleetKubeConnection }}
          command: login
      - task: AzureCLI@2
        displayName: Dispatch newly approved changes
        inputs:
          azureSubscription: ${{ variables.fleetAzureConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -uo pipefail
            export AZDO_ORG="$(basename "${SYSTEM_COLLECTIONURI%/}")"
            failed=0
            trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
            only="$(trim "${FLEET_ONLY_CHANGE:-}")"; agent="$(trim "${FLEET_RUN_AGENT:-}")"
            case "${FLEET_REF:-}" in
              refs/heads/?*) export FLEET_REF="${FLEET_REF#refs/heads/}" ;;
              *) echo "##vso[task.logissue type=error]not a branch run: ${FLEET_REF:-unset}"; exit 1 ;;
            esac
            export FLEET_KUBE_CONTEXT=
            trusted="${FLEET_TRUSTED_BRANCH:-main}"
            git fetch -q --depth 1 origin "+refs/heads/$trusted:refs/remotes/origin/$trusted" \
              && git show "origin/$trusted:.specclaw/config.yaml" > "$AGENT_TEMPDIRECTORY/fleet-trusted-config.yaml" \
              || { echo "##vso[task.logissue type=error]could not read .specclaw/config.yaml from $trusted"; exit 1; }
            export FLEET_TRUSTED_CONFIG="$AGENT_TEMPDIRECTORY/fleet-trusted-config.yaml"
            FLEET_TRUSTED_COMMIT="$(git rev-parse "origin/$trusted")" && [[ -n "$FLEET_TRUSTED_COMMIT" ]] || exit 1; export FLEET_TRUSTED_COMMIT
            case "$FLEET_REF" in feature/?*) specclaw-fleet feature advance "${FLEET_REF#feature/}"; exit $? ;; esac
            for f in .specclaw/changes/*/state.json; do
              [[ -f "$f" ]] || continue
              if ! pending="$(jq -r --arg only "$only" '.phases.proposal.status == "approved" and ($only != "" or .phase == "proposal")' "$f")"; then
                echo "##vso[task.logissue type=error]could not read $f"; failed=1; continue
              fi
              [[ "$pending" == true ]] || continue
              change="$(basename "$(dirname "$f")")"
              [[ -z "$only" || "$change" == "$only" ]] || continue
              rc=0
              specclaw-fleet dispatch "$change" ${agent:+--agent "$agent"} || rc=$?
              case "$rc" in
                0|3) ;;
                5) echo "##vso[task.logissue type=warning]$f: assignee's codex slot is busy; re-run this pipeline or dispatch manually once it finishes" ;;
                4) echo "##vso[task.logissue type=warning]$f: dispatch refused; see the work item" ;;
                *) failed=1 ;;
              esac
            done
            exit "$failed"
        env:
          AZDO_TOKEN: $(System.AccessToken)
          AZDO_PROJECT: $(System.TeamProject)
          BUILD_REQUESTEDFOR: $(Build.RequestedFor)
          BUILD_REQUESTEDFOREMAIL: $(Build.RequestedForEmail)
          FLEET_REF: $(Build.SourceBranch)
          FLEET_TRUSTED_BRANCH: $(fleetTrustedBranch)
          FLEET_ONLY_CHANGE: ${{ parameters.change }}
          FLEET_RUN_AGENT: ${{ parameters.agent }}
