parameters:
  - name: pool
    type: string
    default: specclaw-fleet
  - name: kubeConnection
    type: string
    default: specclaw-fleet-k3s
  - name: azureConnection
    type: string
    default: specclaw-fleet-azure
  - name: vault
    type: string
    default: specclaw-fleet-kv
  - name: image
    type: string
    default: specclaw-fleet:latest
  - name: namespace
    type: string
    default: specclaw-fleet
  - name: deadlineMinutes
    type: string
    default: "120"
  - name: defaultAgent
    type: string
    default: claude

trigger:
  batch: true
  branches:
    include: [main]
  paths:
    include: [".specclaw/changes/*/state.json"]
pr: none

pool:
  name: ${{ parameters.pool }}

steps:
  - checkout: self
    fetchDepth: 1
  - task: Kubernetes@1
    displayName: kubectl login
    inputs:
      connectionType: Kubernetes Service Connection
      kubernetesServiceEndpoint: ${{ parameters.kubeConnection }}
      command: login
  - task: AzureCLI@2
    displayName: Dispatch newly approved changes
    inputs:
      azureSubscription: ${{ parameters.azureConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -uo pipefail
        export AZDO_ORG="$(basename "${SYSTEM_COLLECTIONURI%/}")"
        failed=0
        for f in .specclaw/changes/*/state.json; do
          [[ -f "$f" ]] || continue
          if ! pending="$(jq -r '.phase == "proposal" and .phases.proposal.status == "approved"' "$f")"; then
            echo "##vso[task.logissue type=error]could not read $f"; failed=1; continue
          fi
          [[ "$pending" == true ]] || continue
          rc=0
          specclaw-fleet dispatch "$(basename "$(dirname "$f")")" || rc=$?
          case "$rc" in
            0|3) ;;
            4) echo "##vso[task.logissue type=warning]$f: dispatch refused; see the work item" ;;
            *) failed=1 ;;
          esac
        done
        exit "$failed"
    env:
      AZDO_TOKEN: $(System.AccessToken)
      AZDO_PROJECT: $(System.TeamProject)
      BUILD_REQUESTEDFOR: $(Build.RequestedFor)
      BUILD_REQUESTEDFOREMAIL: $(Build.RequestedForEmail)
      FLEET_VAULT: ${{ parameters.vault }}
      FLEET_IMAGE: ${{ parameters.image }}
      FLEET_NAMESPACE: ${{ parameters.namespace }}
      FLEET_DEADLINE_MINUTES: ${{ parameters.deadlineMinutes }}
      FLEET_DEFAULT_AGENT: ${{ parameters.defaultAgent }}
      FLEET_REF: $(Build.SourceBranchName)
