name: fleet-image

on:
  push:
    tags: ["fleet-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 0.8.9"
        required: true
      codex_version:
        description: "Codex CLI version baked into the image"
        required: true
        default: "0.167.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fleet-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and validate tag
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          CODEX_INPUT: ${{ inputs.codex_version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/specclaw-fleet
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-${GITHUB_REF_NAME#fleet-v}}"; codex="${CODEX_INPUT:-0.167.0}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]] || { echo "::error::bad tag: $tag"; exit 1; }
          [[ "$codex" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad codex version: $codex"; exit 1; }
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r '.token // empty')"
          [[ -n "$token" ]] || { echo "::error::could not get a GHCR token"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/$tag")"
          case "$code" in
            404) ;;
            200) echo "::error::$IMAGE:$tag already exists"; exit 1 ;;
            *) echo "::error::cannot tell whether $IMAGE:$tag exists (HTTP $code)"; exit 1 ;;
          esac
          { echo "tag=$tag"; echo "codex=$codex"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: plugins/specclaw-fleet/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CODEX_VERSION=${{ steps.tag.outputs.codex }}
          tags: ghcr.io/${{ github.repository_owner }}/specclaw-fleet:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
