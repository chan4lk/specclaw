name: fleet-image

on:
  push:
    tags: ["fleet-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 0.8.9"
        required: true
      codex_version:
        description: "Codex CLI version baked into the image"
        required: true
        default: "0.167.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: echo "tag=${TAG_INPUT:-${GITHUB_REF_NAME#fleet-v}}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: plugins/specclaw-fleet/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CODEX_VERSION=${{ inputs.codex_version || '0.167.0' }}
          tags: ghcr.io/${{ github.repository_owner }}/specclaw-fleet:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
